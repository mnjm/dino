[project]
name = "dino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.14.3; sys_platform != 'linux'",
    "faiss-gpu>=1.14.3; sys_platform == 'linux'",
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pytz>=2026.3.post1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.69.1",
    "transformers>=5.14.1",
    "wandb>=0.28.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ipykernel>=7.3.0",
    "ruff>=0.16.0",
]

[tool.basedpyright]
exclude = [".venv/", "**/*.ipynb"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
failOnWarnings = true
# Don't require exhaustive typing
reportAny = false
reportExplicitAny = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
# Relax rules that often get in the way in ML code
reportPrivateImportUsage = false
# Keep useful diagnostics
reportMissingImports = true
reportUnusedImport = true
reportUnusedVariable = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryIsInstance = "warning"

[tool.ruff]
line-length = 300 # effectively no line length
exclude = [ "*.ipynb", "**/*.ipynb", ".ipynb_checkpoints", ".venv/" ]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
]

ignore = [
    "E501",     # let formatter handle line length
    "E741",     # allow l, O, I variable names if desired
    "B008",     # allow function calls in defaults
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false
